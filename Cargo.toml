[workspace]
members = ["crates/protocol", "crates/daemon", "crates/cli", "crates/pam"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
btmgmt = "0.2.5"
bluer = { version = "0.17", features = ["bluetoothd"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
futures-util = "0.3"
nix = { version = "0.29", features = ["poll", "term", "time"] }
pam = { version = "0.8", default-features = false, features = ["module"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util", "sync", "fs", "process"] }
toml = "0.8"
toml_edit = "0.22"
uuid = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
